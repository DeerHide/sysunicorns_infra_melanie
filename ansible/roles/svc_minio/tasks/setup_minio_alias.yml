---
# code: language=ansible
# Path: ansible/roles/svc_minio/tasks/setup_minio_alias.yml
# This file contains the tasks to create deerhide-operator alias for Minio

- name: Check and create alias if needed
  block:
    - name: Check if melanie alias exists
      ansible.builtin.command:
        cmd: mc alias list
      changed_when: false
      register: minio_alias_list

    - name: Get Minio container IP address
      ansible.builtin.shell:
        cmd: docker inspect svc_minio | jq -r '.[0].NetworkSettings.Networks[].IPAddress'
      register: minio_container_ip

    - name: Create alias melanie if don't exists
      ansible.builtin.command:
        cmd: mc alias set melanie http://{{ minio_container_ip.stdout }}:9000 {{ svc_minio_root_user }} {{ svc_minio_root_password }}
      changed_when: true
      when: "'melanie' not in minio_alias_list.stdout"
