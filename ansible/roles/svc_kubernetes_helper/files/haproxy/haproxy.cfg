frontend http_front_6443
  bind *:6443
  timeout client 60s
  mode tcp
  option tcplog
  default_backend http_back_6443

backend http_back_6443
  mode tcp
  option tcplog
  option tcp-check
  balance source
  default-server inter 10s downinter 5s rise 2 fall 2 slowstart 60s maxconn 250 maxqueue 256 weight 100
  server m01 192.168.3.17:6443 check
  server m02 192.168.3.16:6443 check
  server m03 192.168.3.15:6443 check
